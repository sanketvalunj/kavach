services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis-local-only}
    ports:
      - "5432:5432"
    volumes:
      - aegis-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      AEGIS_DATABASE_URL: postgresql+psycopg://aegis:${POSTGRES_PASSWORD:-aegis-local-only}@postgres:5432/aegis
      AEGIS_JWT_SECRET: ${AEGIS_JWT_SECRET:-local-development-only-change-this-signing-secret-0123456789}
      AEGIS_OPERATOR_USERNAME: ${AEGIS_OPERATOR_USERNAME:-operator}
      AEGIS_OPERATOR_PASSWORD: ${AEGIS_OPERATOR_PASSWORD:-operator-local-only}
      AEGIS_RESEARCHER_USERNAME: ${AEGIS_RESEARCHER_USERNAME:-researcher}
      AEGIS_RESEARCHER_PASSWORD: ${AEGIS_RESEARCHER_PASSWORD:-researcher-local-only}
      AEGIS_BACKEND_MODE: ${AEGIS_BACKEND_MODE:-SIMULATION}
      AEGIS_POLICY_MODE: ${AEGIS_POLICY_MODE:-DETERMINISTIC}
      AEGIS_POLICY_CHECKPOINT: ${AEGIS_POLICY_CHECKPOINT:-app/ml/checkpoints/ppo_ablations/complete_smart_scan/final.zip}
      AEGIS_CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
    ports:
      - "8000:8000"
    volumes:
      - ${AEGIS_MODEL_DIR:-./backend/app/ml/checkpoints}:/models:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)); assert d['database']=='ok'"]
      interval: 20s
      timeout: 5s
      start_period: 120s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  aegis-postgres:
  frontend-node-modules:
