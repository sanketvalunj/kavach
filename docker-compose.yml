services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kavach
      POSTGRES_USER: kavach
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kavach-local-only}
    ports:
      - "5432:5432"
    volumes:
      - kavach-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kavach -d kavach"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      KAVACH_DATABASE_URL: ${KAVACH_DATABASE_URL:-postgresql+psycopg://kavach:${POSTGRES_PASSWORD:-kavach-local-only}@postgres:5432/kavach}
      KAVACH_JWT_SECRET: ${KAVACH_JWT_SECRET:-local-development-only-change-this-signing-secret-0123456789}
      KAVACH_OPERATOR_USERNAME: ${KAVACH_OPERATOR_USERNAME:-operator}
      KAVACH_OPERATOR_PASSWORD: ${KAVACH_OPERATOR_PASSWORD:-operator-local-only}
      KAVACH_RESEARCHER_USERNAME: ${KAVACH_RESEARCHER_USERNAME:-researcher}
      KAVACH_RESEARCHER_PASSWORD: ${KAVACH_RESEARCHER_PASSWORD:-researcher-local-only}
      KAVACH_BACKEND_MODE: ${KAVACH_BACKEND_MODE:-SIMULATION}
      KAVACH_POLICY_MODE: ${KAVACH_POLICY_MODE:-DETERMINISTIC}
      KAVACH_POLICY_CHECKPOINT: ${KAVACH_POLICY_CHECKPOINT:-app/ml/checkpoints/ppo_ablations/complete_smart_scan/final.zip}
      KAVACH_CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
    ports:
      - "8000:8000"
    volumes:
      - ${KAVACH_MODEL_DIR:-./backend/app/ml/checkpoints}:/models:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)); assert d['database']=='ok'"]
      interval: 20s
      timeout: 5s
      start_period: 120s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  kavach-postgres:
  frontend-node-modules:
